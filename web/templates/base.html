<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CU-Kizuna — your network, in motion{% endblock %}</title>
  <meta name="description" content="CU-Kizuna: connections, feeds, events and communities.">
  <meta name="theme-color" id="theme-color" content="#dcd6f7">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("campus-theme");
        if (saved !== "light" && saved !== "dark") saved = "light";
        document.documentElement.dataset.theme = saved;
        document.getElementById("theme-color").content = saved === "dark" ? "#0f1226" : "#dcd6f7";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.jpg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <div class="aurora" aria-hidden="true">
    <span class="aurora-1"></span>
    <span class="aurora-2"></span>
    <span class="aurora-3"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <div class="toast-stack" id="toast-stack">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
